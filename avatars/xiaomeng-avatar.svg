<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2b5e"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </radialGradient>
    <radialGradient id="irisL" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="60%" stop-color="#c44a8c"/>
      <stop offset="100%" stop-color="#8a2e6e"/>
    </radialGradient>
    <radialGradient id="irisR" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="60%" stop-color="#c44a8c"/>
      <stop offset="100%" stop-color="#8a2e6e"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#7d4fa8" stroke-width="3" opacity="0.5"/>

  <!-- Hair base -->
  <ellipse cx="256" cy="236" rx="150" ry="170" fill="#6a3f8c"/>
  <ellipse cx="240" cy="226" rx="125" ry="145" fill="#7d4fa8"/>

  <!-- Side hair -->
  <path d="M166,206 C130,260 145,310 165,320 C175,290 178,250 180,220 Z" fill="#6a3f8c"/>
  <path d="M346,206 C382,260 367,310 347,320 C337,290 334,250 332,220 Z" fill="#6a3f8c"/>

  <!-- Face -->
  <ellipse cx="256" cy="256" rx="85" ry="100" fill="#fce4d6"/>

  <!-- Blush -->
  <ellipse cx="226" cy="271" rx="20" ry="10" fill="rgba(255,150,150,0.35)" transform="rotate(-15,226,271)"/>
  <ellipse cx="286" cy="271" rx="20" ry="10" fill="rgba(255,150,150,0.35)" transform="rotate(15,286,271)"/>

  <!-- Bangs -->
  <path d="M166,196 C200,130 240,120 256,126 C272,120 312,130 346,196 C340,150 310,130 256,130 C202,130 172,150 166,196 Z" fill="#6a3f8c"/>
  <!-- Bang strands -->
  <path d="M200,130 C210,170 220,200 215,230 C205,200 195,170 190,140 Z" fill="#7d4fa8" opacity="0.6"/>
  <path d="M300,130 C295,165 285,195 280,215 C290,190 300,160 310,135 Z" fill="#7d4fa8" opacity="0.6"/>
  <path d="M240,120 C245,155 250,180 248,210 C238,180 233,150 235,125 Z" fill="#7d4fa8" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M210,216 C225,206 240,212" fill="none" stroke="#5a2d7a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M272,212 C287,206 302,216" fill="none" stroke="#5a2d7a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left eye -->
  <ellipse cx="228" cy="248" rx="22" ry="26" fill="white"/>
  <ellipse cx="228" cy="248" rx="18" ry="22" fill="url(#irisL)"/>
  <circle cx="230" cy="250" r="8" fill="#1a0a2e"/>
  <circle cx="234" cy="240" r="5" fill="white"/>
  <circle cx="226" cy="252" r="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Left eyelashes -->
  <path d="M206,248 A22,26 0 0,1 250,248" fill="none" stroke="#2d1b4e" stroke-width="2.5"/>

  <!-- Right eye -->
  <ellipse cx="284" cy="248" rx="22" ry="26" fill="white"/>
  <ellipse cx="284" cy="248" rx="18" ry="22" fill="url(#irisR)"/>
  <circle cx="286" cy="250" r="8" fill="#1a0a2e"/>
  <circle cx="290" cy="240" r="5" fill="white"/>
  <circle cx="282" cy="252" r="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Right eyelashes -->
  <path d="M262,248 A22,26 0 0,1 306,248" fill="none" stroke="#2d1b4e" stroke-width="2.5"/>

  <!-- Nose -->
  <path d="M256,260 L253,268 L259,268 Z" fill="#f0c0b0"/>

  <!-- Mouth - cute smile -->
  <path d="M244,278 A12,8 0 0,0 268,278" fill="none" stroke="#e07080" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M248,277 A8,5 0 0,0 264,277" fill="none" stroke="rgba(255,150,150,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hair flower ornament -->
  <g transform="translate(330,190)">
    <ellipse cx="0" cy="-8" rx="6" ry="10" fill="#ff8fa8" transform="rotate(0)"/>
    <ellipse cx="0" cy="-8" rx="6" ry="10" fill="#ff8fa8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-8" rx="6" ry="10" fill="#ff8fa8" transform="rotate(144)"/>
    <ellipse cx="0" cy="-8" rx="6" ry="10" fill="#ff8fa8" transform="rotate(216)"/>
    <ellipse cx="0" cy="-8" rx="6" ry="10" fill="#ff8fa8" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="5" fill="#ffd700"/>
  </g>

  <!-- Sparkles -->
  <g fill="rgba(255,255,255,0.6)">
    <path d="M140,160 L144,170 L154,174 L144,178 L140,188 L136,178 L126,174 L136,170 Z"/>
    <path d="M380,170 L383,178 L391,181 L383,184 L380,192 L377,184 L369,181 L377,178 Z"/>
    <path d="M125,330 L128,336 L134,339 L128,342 L125,348 L122,342 L116,339 L122,336 Z"/>
    <path d="M390,340 L393,346 L399,349 L393,352 L390,358 L387,352 L381,349 L387,346 Z"/>
    <path d="M160,380 L162,384 L166,386 L162,388 L160,392 L158,388 L154,386 L158,384 Z"/>
  </g>

  <!-- Stars -->
  <circle cx="390" cy="220" r="3" fill="rgba(255,255,200,0.6)"/>
  <circle cx="130" cy="250" r="2" fill="rgba(255,255,200,0.5)"/>
  <circle cx="370" cy="300" r="2" fill="rgba(255,255,200,0.5)"/>

  <!-- Glow ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,150,200,0.15)" stroke-width="8"/>
</svg>
